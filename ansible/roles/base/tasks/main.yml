---
- name: Actualizar caché de apt e instalar prerrequisitos
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Crear directorio de llaveros de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la llave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Añadir el repositorio de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Instalar Docker Engine y el plugin de Compose
  ansible.builtin.apt:
    update_cache: true
    name: "{{ docker_packages }}"
    state: present

- name: Asegurar que el servicio Docker está activo y habilitado al arranque
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Añadir el usuario devops al grupo docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Crear la estructura de directorios en /srv
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ srv_base }}/app"
    - "{{ srv_base }}/mongo"
    - "{{ srv_base }}/mongo/data"
    - "{{ srv_base }}/loadbalancer"

- name: Política por defecto — denegar tráfico entrante
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Política por defecto — permitir tráfico saliente
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Permitir SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Permitir tráfico web (HTTP) hacia los balanceadores
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp

- name: Permitir todo el tráfico interno del clúster
  community.general.ufw:
    rule: allow
    src: "{{ internal_subnet }}"

- name: Activar el firewall
  community.general.ufw:
    state: enabled
