name: Despliegue continuo a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Ansible y colecciones
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.general community.docker

      - name: Inyectar la llave SSH desde los secretos
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ejecutar el playbook de despliegue
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook site.yml

      - name: Verificar que el servicio responde
        run: curl -sf http://$\{\{ secrets.VIP_ADDRESS }}/ || exit 1
